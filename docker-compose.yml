version: '3.8'

services:
  smvs-report-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smvs-report-app:latest
    container_name: smvs_report_portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=smvs_secret_key_2026_super_secure
      - DB_PATH=/app/smvs.sqlite
    volumes:
      # Persistent SQLite volume mapping on host
      - ./smvs.sqlite:/app/smvs.sqlite
