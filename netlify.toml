[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[dev]
  command = "npm run dev"
  port = 5173

[[redirects]]
  from = "/report.html"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
