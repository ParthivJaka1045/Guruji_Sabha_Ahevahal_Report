<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>SMVS Report - Public View</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome CSS (Cloudflare + JSDelivr + Unpkg) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    
    <!-- FontAwesome SVG JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" data-auto-replace-svg="nest" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="loader" class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center" style="z-index: 9999;">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 fw-bold text-primary mb-0" style="font-size: 0.95rem; letter-spacing: 1px;">PROCESSING...</p>
    </div>

    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title fw-bold mb-0"><i class="fa-solid fa-eye me-2 text-primary"></i>Report Preview</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="previewContent" class="p-3"></div>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal"><i class="fa-solid fa-xmark me-1"></i> Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="reportUnavailableModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content public-light-modal">
                <div class="modal-header">
                    <h6 class="modal-title fw-bold mb-0 text-warning">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>Report Unavailable
                    </h6>
                </div>
                <div id="reportUnavailableText" class="modal-body public-unavailable-text">
                    Report is not available. Please contact admin to get report.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100" onclick="goToLogin()">Quit</button>
                </div>
            </div>
        </div>
    </div>

    <div class="public-report-wrap">
        <div class="public-report-card">
            <div class="public-report-header">
                <div>
                    <div class="public-header-brand">SMVS Report Portal</div>
                    <h4 class="mb-0">New Report Created</h4>
                </div>
                <button type="button" class="btn public-back-btn" onclick="goToLogin()" title="Back to Login">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>

            <div class="public-report-body">
                <div class="public-auto-mail">Auto mail (first-time creation only)</div>
                <div class="public-report-grid">
                    <div class="public-info-box">
                        <div class="public-info-label">DATE</div>
                        <div id="publicDateValue" class="public-info-value">-</div>
                    </div>
                    <div class="public-info-box">
                        <div class="public-info-label">LOCATION</div>
                        <div id="publicLocationValue" class="public-info-value">-</div>
                    </div>
                    <div class="public-info-box public-info-box-wide">
                        <div class="public-info-label">SUBJECT</div>
                        <div id="publicSubjectValue" class="public-info-value public-info-value-accent">-</div>
                    </div>
                </div>

                <div class="public-report-actions">
                    <button id="publicPreviewBtn" type="button" class="btn btn-outline-warning w-100 fw-bold mb-2" disabled>
                        <i class="fa-solid fa-eye me-2"></i>PREVIEW PDF
                    </button>
                    <button id="publicDownloadBtn" type="button" class="btn btn-primary w-100 fw-bold" disabled>
                        <i class="fa-solid fa-download me-2"></i>DOWNLOAD OFFICIAL PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="/src/public-report.js"></script>
</body>
</html>
